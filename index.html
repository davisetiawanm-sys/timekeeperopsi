<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timekeeper Prismaksi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <!-- Timer Section -->
        <div class="timer-section">
            <h1 id="display">00:00</h1>
                <div class="input-controls">
                     <input type="number" id="minutesInput" placeholder="Min" min="0">
                    <input type="number" id="secondsInput" placeholder="Sec" min="0" max="59">
                    <button onclick="startTimer()" class="btn-start">START</button>
                    <button onclick="resetTimer()" class="btn-reset">RESET</button>
                </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
